name: Jalons

on:
  push:
    branches: [develop]
    paths: ['.github/milestones.json']
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Créer / mettre à jour les jalons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/milestones.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            });
            for (const m of wanted) {
              const found = existing.find(e => e.title === m.title);
              if (found) {
                if (found.description !== m.description) {
                  await github.rest.issues.updateMilestone({
                    owner: context.repo.owner, repo: context.repo.repo,
                    milestone_number: found.number, description: m.description,
                  });
                  core.info(`Mis à jour : ${m.title}`);
                }
              } else {
                await github.rest.issues.createMilestone({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: m.title, description: m.description,
                });
                core.info(`Créé : ${m.title}`);
              }
            }
