name: Release

# Publication : à chaque arrivée sur main (version validée), le tag vX.Y.Z et la Release
# sont créés automatiquement s'ils n'existent pas encore. Un tag poussé à la main marche aussi.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publier la version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONNOEL_RELEASE: 'true'
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier le tag, la version et les notes
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^monnoel.version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à monnoel.version=${VERSION}"; exit 1
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "La release ${TAG} existe déjà : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ ! -f "docs/release-notes/${TAG}.md" ]; then
            echo "::error::Notes de version manquantes : docs/release-notes/${TAG}.md"; exit 1
          fi
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secrets de signature absents"; exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Clé de signature
        if: steps.version.outputs.skip != 'true'
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests et APK signé
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Préparer l'APK
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/mon-noel-${{ steps.version.outputs.tag }}.apk"

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mon Noël ${{ steps.version.outputs.tag }}
          body_path: docs/release-notes/${{ steps.version.outputs.tag }}.md
          files: dist/*.apk
          make_latest: true
